server:
  port: 8084
  servlet:
    context-path: "/ead-notification/"

spring:
  application:
    name: ead-notification-service
  datasource:
    url: jdbc:postgresql://localhost:5432/ead-notification-v2
    username: postgres
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        jdbc:
          lob:
            non-contextual-creation: true
  output:
    ansi:
      enabled: Always

  rabbitmq:
    addresses: amqps://iaopsvsl:XUe8zZ9qTv9qGPzb_GWqhyHNRZfiVNDK@beaver.rmq.cloudamqp.com/iaopsvsl

logging:
  level:
    com.ead: TRACE
    root: INFO
    org.springframework.web: DEBUG
    org.hibernate: INFO

management:
  endpoints:
    web:
      exposure:
        include:
          - refresh
          - health
